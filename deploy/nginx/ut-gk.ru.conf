# Production nginx for ut-gk.ru
# cp deploy/nginx/ut-gk.ru.conf /etc/nginx/sites-available/ut-gk.ru
# ln -sf /etc/nginx/sites-available/ut-gk.ru /etc/nginx/sites-enabled/ut-gk.ru
# nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream uraltrade_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name ut-gk.ru www.ut-gk.ru;

    ssl_certificate /etc/letsencrypt/live/ut-gk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ut-gk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 32M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Пользовательские страницы — без кэша
    location ~ ^/(cart|favorites|compare|admin)(/|$) {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;

        proxy_pass http://uraltrade_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Публичные страницы — умеренный CDN/прокси-кэш
    location / {
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, s-maxage=300, stale-while-revalidate=600" always;

        proxy_pass http://uraltrade_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ut-gk.ru www.ut-gk.ru;

    if ($host = ut-gk.ru) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
